name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'banned-dids.txt'
      - 'kept-dids.txt'
      - 'scripts/watchdog_checks.py'
      - 'scripts/tests/**'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: backend-deploy
  cancel-in-progress: true

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python -m pip install pytest httpx openai 'numpy<2.2' scikit-learn hdbscan pydantic-settings

      - name: Test Python checks
        run: python -m pytest scripts/tests -q

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Test backend
        working-directory: backend
        run: zig build test --summary all

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # banned-dids.txt is the repo-root single source of truth; the backend
      # build context is backend/, so stage a copy in before the remote build.
      - name: Stage shared DID lists
        run: cp banned-dids.txt kept-dids.txt backend/

      - name: Deploy to Fly.io
        working-directory: backend
        run: flyctl deploy --remote-only
