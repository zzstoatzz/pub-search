name: Reconcile Recommends

# Closes the small gap left by PDSes that don't expose records (Bridgy Fed
# bridged accounts on atproto.brid.gy, etc.) by checking recently-recommended
# docs against constellation's view of the network.
#
# constellation is community-run. This used to run hourly over every document
# from 8 threads and got most of its requests 429'd (2026-09-07). Keep it
# daily, single-worker, recency-scoped; the script fails the job when rate
# limiting persists so a regression shows up red instead of silently doing
# nothing.

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch: # allow manual trigger

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run reconcile
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: ./scripts/reconcile-recommends
