<!doctype html>
<meta charset="utf-8">
<title>Atlas GL rendering checks</title>
<pre id="result">running</pre>
<canvas id="scene"></canvas>
<script src="../../site/atlas-gl.js"></script>
<script>
(async function() {
  var result = document.getElementById('result');
  var canvas = document.getElementById('scene');
  var gl = canvas.getContext('webgl');
  var uploads = 0, deletes = 0;
  var upload = gl.texImage2D.bind(gl), remove = gl.deleteTexture.bind(gl);
  gl.texImage2D = function() { uploads++; return upload.apply(null, arguments); };
  gl.deleteTexture = function(texture) { deletes++; return remove(texture); };
  function assert(value, message) { if (!value) throw new Error(message); }
  function texture(color) {
    var cv = document.createElement('canvas');
    cv.width = cv.height = 128;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, 128, 128);
    return cv;
  }
  try {
    var atlas = window.AtlasGL.create(canvas);
    assert(atlas, 'WebGL initialization failed');
    function frame(dark) {
      atlas.frame({ W: 160, H: 160, dpr: 1, dark: dark, lineFade: 0 });
      atlas.beginPlanets(160, 160, 1, dark);
    }
    function draw(tex, radius, avatar, rotation) {
      atlas.drawPlanet(tex, 80, 80, radius, 1, rotation || 0, {
        avatar: avatar, base: [0, 0, 0], accent: [0, 1, 0], dpr: 1,
      });
      assert(gl.getError() === gl.NO_ERROR, 'WebGL error');
    }
    var red = texture('#ff0000');
    var pixel = new Uint8Array(4);
    var radii = [4, 6, 10, 14, 29, 30, 31, 60];
    for (var dark of [true, false]) {
      for (var radius of radii) {
        for (var rotation of [0, 1, 2, 3, 4, 5]) {
          frame(dark);
          draw(red, radius, true, rotation);
          gl.readPixels(80, 80, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
          assert(pixel[0] > 140 && pixel[1] < 25 && pixel[2] < 25 && pixel[3] > 240,
            'Avatar changed at radius ' + radius + ', rotation ' + rotation + ': ' + pixel);
        }
      }
    }
    assert(uploads === 1, 'Zoom or theme reuploaded the avatar');
    var split = texture('#ff0000');
    var splitContext = split.getContext('2d');
    splitContext.fillStyle = '#0000ff';
    splitContext.fillRect(64, 0, 64, 128);
    var seamPixels = [];
    for (var rotation of [Math.PI / 2 - 0.05, Math.PI / 2 + 0.05]) {
      frame(true);
      draw(split, 60, true, rotation);
      gl.readPixels(80, 80, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
      seamPixels.push(Array.from(pixel));
    }
    assert(seamPixels[0].every(function(v, i) { return Math.abs(v - seamPixels[1][i]) < 10; }),
      'Avatar wrap jumps at the hemisphere boundary');
    var many = Array.from({length: 300}, function() { return texture('#00ff00'); });
    for (var pass = 0; pass < 3; pass++) {
      frame(true);
      for (var tex of many) draw(tex, 10, true, 0);
    }
    assert(uploads === 302, 'Visible textures churned in the cache');
    for (var pass = 0; pass < 4; pass++) {
      frame(true);
      draw(many[0], 10, true, 0);
    }
    assert(deletes >= 45, 'Unused GPU textures were not released');
    var before = uploads;
    frame(true);
    draw(many[0], 60, true, 0);
    assert(uploads === before, 'Active texture was evicted');
    var blank = document.createElement('canvas');
    blank.width = 1280;
    blank.height = 112;
    draw(blank, 30, false, 0);
    gl.readPixels(80, 80, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
    assert(pixel[3] > 240, 'Document planet path stopped rendering');
    var ink = texture('#ffffff');
    ink.width = 1280;
    ink.height = 112;
    var inkContext = ink.getContext('2d');
    inkContext.fillStyle = '#ffffff';
    inkContext.fillRect(0, 0, ink.width, ink.height);
    var material = {core: [0.6, 0.9, 0.8], mid: [0.2, 0.6, 0.4], edge: [0.05, 0.2, 0.1]};
    atlas.setPalette([material]);
    atlas.uploadPoints(1, new Float32Array([0]), new Float32Array([0]), new Uint8Array([0]));
    atlas.frame({W:160,H:160,dpr:1,dark:true,scale:1,cx:80,cy:80,radius:30,starness:0,alpha:1,dim:1,lineFade:0,hoverIdx:-1});
    var samples = [[80,80],[70,90],[90,70]], points = [];
    for (var xy of samples) {
      gl.readPixels(xy[0],xy[1],1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
      points.push(Array.from(pixel));
    }
    atlas.uploadPoints(0, new Float32Array(0), new Float32Array(0), new Uint8Array(0));
    var levels = [], documentUploads = uploads;
    for (var opacity of [0, 0.25, 0.5, 0.75, 1]) {
      frame(true);
      atlas.drawPlanet(ink,80,80,30,1,0,{core:material.core,accent:material.mid,base:material.edge,textAlpha:opacity,dpr:1});
      gl.readPixels(80,80,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
      levels.push(pixel[0]);
      if (opacity === 0) {
        for (var j=0;j<samples.length;j++) {
          gl.readPixels(samples[j][0],samples[j][1],1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
          assert(points[j].every(function(v,k){return Math.abs(v-pixel[k])<6;}), 'Point and document lighting differ: '+points[j]+' / '+pixel);
        }
      }
    }
    assert(levels.every(function(v,j){return j===0 || v>levels[j-1];}), 'Text does not emerge progressively');
    assert(uploads===documentUploads+1, 'Document detail changes reupload texture');
    assert(gl.getError()===gl.NO_ERROR, 'Document rendering produced a WebGL error');
    for (var radius of [3,7,14,30,60]) {
      atlas.uploadPoints(1,new Float32Array([0]),new Float32Array([0]),new Uint8Array([0]),new Float32Array([1000]));
      atlas.frame({W:160,H:160,dpr:1,dark:true,scale:1,cx:80,cy:80,radius:radius,starness:0,alpha:1,dim:1,lineFade:0,hoverIdx:-1});
      var body = new Uint8Array(160*160*4), layered = new Uint8Array(body.length);
      gl.readPixels(0,0,160,160,gl.RGBA,gl.UNSIGNED_BYTE,body);
      atlas.beginPlanets(160,160,1,true);
      atlas.drawPlanet(blank,80,80,radius,1,0,{core:material.core,accent:material.mid,base:material.edge,surfaceOnly:true,dpr:1});
      gl.readPixels(0,0,160,160,gl.RGBA,gl.UNSIGNED_BYTE,layered);
      assert(body.every(function(v,j){return v===layered[j];}), 'Surface detail altered sphere body at radius '+radius);
    }
    assert(gl.getError()===gl.NO_ERROR, 'Single-body rendering produced a WebGL error');
    result.textContent = 'PASS: avatar color at 8 radii, 6 rotations, and both themes; one upload across zoom/theme; continuous hemisphere wrap; 300 visible textures without churn; inactive GPU eviction; matching point/document lighting; progressive text opacity; mipmapped document texture reused across detail levels; surface detail preserves every body pixel at five radii.';
  } catch (error) {
    result.textContent = 'FAIL: ' + error.message;
    console.error(error);
  }
})();
</script>
